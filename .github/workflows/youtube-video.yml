name: YouTube Video Production

on:
  schedule:
    - cron: '0 6,18 * * 1,3,5'  # Segunda, Quarta, Sexta às 6h e 18h
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install dependencies
        run: |
          pip install requests python-dotenv
      
      - name: Generate Relaxing Video
        run: |
          mkdir -p workspace/output
          
          # Create 10-minute relaxing video
          ffmpeg -y -f lavfi -i "color=c=#0a0a23:s=1920x1080:d=600:rate=30" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Relaxing Music':fontsize=48:fontcolor=white:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p \
            workspace/output/relaxing_music.mp4
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaxing-video
          path: workspace/output/relaxing_music.mp4
          retention-days: 30